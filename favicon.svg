<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Ivory tile with a gold hairline frame -->
  <rect x="2" y="2" width="96" height="96" rx="20" ry="20" fill="#FAF8F3" stroke="#C9A55C" stroke-width="4"/>

  <!-- Star of David in gold -->
  <g fill="none" stroke="#C9A55C" stroke-width="4" stroke-linejoin="round">
    <polygon points="50,10 85,71 15,71"/>
    <polygon points="50,90 15,29 85,29"/>
  </g>

  <!-- "YT" monogram in navy, drawn as strokes so it renders the same without fonts -->
  <g fill="none" stroke="#14213D" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M30.5 40.5 L39 52 L47.5 40.5 M39 52 V64"/>
    <path d="M52 42 H70 M61 42 V64"/>
  </g>
</svg>
